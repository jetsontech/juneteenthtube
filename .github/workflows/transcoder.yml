name: Free Cloud Transcoder

on:
  repository_dispatch:
    types: [transcode]

jobs:
  transcode:
    name: Transcode Video to HLS
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub Actions max timeout is 6 hours (360 mins)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install TSX Globally
        run: npm install -g tsx

      - name: Ensure FFmpeg is Installed
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Run Transcoder Engine
        env:
          VIDEO_ID: ${{ github.event.client_payload.videoId }}
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
        run: |
          echo "Starting transcode for video: $VIDEO_ID"
          tsx scripts/transcode_worker.ts
